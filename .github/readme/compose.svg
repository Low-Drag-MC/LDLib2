<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562.5" role="img" aria-labelledby="title desc">
  <title id="title">LDLib2 Compose</title>
  <desc id="desc">A Kotlin composable that renders a todo list, next to the LDLib2 panel it produces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#18212f"/>
      <stop offset="0.52" stop-color="#142b2e"/>
      <stop offset="1" stop-color="#2a2438"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1000" height="562.5" rx="28" fill="url(#bg)"/>
  <circle cx="135" cy="88" r="70" fill="#38bdf8" opacity="0.12"/>
  <circle cx="880" cy="460" r="110" fill="#f59e0b" opacity="0.10"/>

  <text x="56" y="70" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Compose UI</text>
  <text x="56" y="106" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Describe the screen as a function of state. Change the state and the UI follows.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="142" width="448" height="340" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="544" y="142" width="400" height="340" rx="18" fill="#0f172a" stroke="#2dd4bf"/>
  </g>

  <text x="84" y="182" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">@Composable code</text>
  <text x="572" y="182" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Live LDLib2 elements</text>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="14" xml:space="preserve" style="white-space:pre">
    <text x="84" y="212.0"><tspan fill="#fde68a">@Composable</tspan></text>
    <text x="84" y="228.8"><tspan fill="#c4b5fd">fun</tspan><tspan fill="#e5e7eb"> Todos(start: List&lt;Todo&gt;) {</tspan></text>
    <text x="84" y="245.6"><tspan fill="#e5e7eb">  </tspan><tspan fill="#c4b5fd">var</tspan><tspan fill="#e5e7eb"> items </tspan><tspan fill="#c4b5fd">by</tspan><tspan fill="#e5e7eb"> remember {</tspan></text>
    <text x="84" y="262.4"><tspan fill="#e5e7eb">    mutableStateOf(start)</tspan></text>
    <text x="84" y="279.2"><tspan fill="#e5e7eb">  }</tspan></text>
    <text x="84" y="296.0"><tspan fill="#e5e7eb">  Column {</tspan></text>
    <text x="84" y="312.8"><tspan fill="#e5e7eb">    items.forEach { todo -&gt;</tspan></text>
    <text x="84" y="329.6"><tspan fill="#e5e7eb">      key(todo.id) {</tspan></text>
    <text x="84" y="346.4"><tspan fill="#e5e7eb">        Toggle(checked = todo.done,</tspan></text>
    <text x="84" y="363.2"><tspan fill="#e5e7eb">          onCheckedChange = { </tspan><tspan fill="#94a3b8">/* … */</tspan><tspan fill="#e5e7eb"> },</tspan></text>
    <text x="84" y="380.0"><tspan fill="#e5e7eb">          text = todo.label)</tspan></text>
    <text x="84" y="396.8"><tspan fill="#e5e7eb">      }</tspan></text>
    <text x="84" y="413.6"><tspan fill="#e5e7eb">    }</tspan></text>
    <text x="84" y="430.4"><tspan fill="#e5e7eb">    Button(onClick = { </tspan><tspan fill="#94a3b8">/* … */</tspan><tspan fill="#e5e7eb"> }, text = </tspan><tspan fill="#86efac">"Add"</tspan><tspan fill="#e5e7eb">)</tspan></text>
    <text x="84" y="447.2"><tspan fill="#e5e7eb">  }</tspan></text>
    <text x="84" y="464.0"><tspan fill="#e5e7eb">}</tspan></text>
  </g>

  <path d="M510 312.0h22" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <path d="M526 302.0l12 10-12 10" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <image x="560.0" y="212.6" width="368.0" height="242.9" style="image-rendering:pixelated" href="data:image/png;base64,"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <rect x="165.5" y="500" width="104.4" height="34" rx="17" fill="#26364d"/>
    <text x="217.7" y="523" fill="#dbeafe">Kotlin</text>
    <rect x="287.9" y="500" width="179.6" height="34" rx="17" fill="#26364d"/>
    <text x="377.7" y="523" fill="#dbeafe">LDLib2 widgets</text>
    <rect x="485.5" y="500" width="142.0" height="34" rx="17" fill="#26364d"/>
    <text x="556.5" y="523" fill="#dbeafe">Lazy lists</text>
    <rect x="645.5" y="500" width="189.0" height="34" rx="17" fill="#123c3a"/>
    <text x="740.0" y="523" fill="#ccfbf1">Optional module</text>
  </g>
</svg>

// ldlib2-compose - bundling it into a downstream mod.
//
// Copy this file into your mod and apply it after your plugins block, with the version you want:
//
//     ext.ldlib2ComposeVersion = '1.0.0'
//     apply from: 'gradle/ldlib2-compose-bundle.gradle'
//
// It adds ldlib2-compose as an `implementation` dependency and Jar-in-Jars it into your mod, together
// with the Compose runtime it needs. Your build must also apply the Kotlin Compose compiler plugin at
// the same version as your Kotlin plugin - see compose.md.
//
// Why a script and not one jarJar line: ldlib2-compose is published to Maven only, so players get it
// inside the mod that uses it. NeoForge unpacks a single level of Jar-in-Jar, and ldlib2-compose keeps
// the Compose runtime as Jar-in-Jar of its own - inside your jar that is two levels down, where it is
// never loaded. So the runtime has to sit at the top level of your jar, next to ldlib2-compose. The list
// is read from ldlib2-compose's published pom rather than written out here, so it cannot drift from
// what that version was built against.
//
// Left out: LDLib2 itself, which players install as a mod, and the Kotlin stdlib, which LDLib2 ships.

def ldlib2ComposeCoordinate = "com.lowdragmc.ldlib2:ldlib2-compose-${minecraft_version}:${ldlib2ComposeVersion}"

configurations {
    ldlib2ComposeBundle {
        canBeConsumed = false
        exclude group: 'com.lowdragmc.ldlib2', module: "ldlib2-neoforge-${minecraft_version}"
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains', module: 'annotations'
    }
}

repositories {
    maven {
        // androidx.collection / androidx.annotation, pulled in by the Compose runtime.
        name = "Google (androidx, for ldlib2-compose)"
        url = "https://maven.google.com"
        content {
            includeGroupByRegex "androidx\\..*"
        }
    }
}

dependencies {
    implementation ldlib2ComposeCoordinate
    ldlib2ComposeBundle ldlib2ComposeCoordinate
}

// Filled in just before the jarJar configuration resolves, so nothing is resolved at configuration
// time. Every resolved jar becomes its own top-level entry, pinned to the version the pom asked for
// but advertising the open range, so NeoForge can still pick one copy when other mods ship the same
// library.
configurations.named('jarJar') {
    withDependencies { dependencies ->
        configurations.ldlib2ComposeBundle.incoming.artifacts.artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            if (!(id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) return
            dependencies.add(project.dependencies.create("${id.group}:${id.module}") {
                version {
                    require "[${id.version},)"
                    prefer id.version
                }
            })
        }
    }
}

// ldlib2-compose - LDLib2's declarative UI layer, shipped as a separate optional mod.
//
// Released on its own: its version is compose_version in this directory's gradle.properties, and
// .github/workflows/compose-build-publish.yml builds and publishes it. The core build and release never
// touch it, and the core's dev runs only load it when asked to (see "Dev runs" below).
//
// A mod rather than a plain library because it carries the Compose runtime, and that has to reach the
// game as Jar-in-Jar: NeoForge then keeps one copy when other mods ship the same libraries (several
// bundle kotlinx-coroutines). Downstream mods Jar-in-Jar this mod's -all jar in turn; NeoForge unpacks
// nested Jar-in-Jar recursively, so the runtime comes with it. Downstream setup is in compose.md.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev'
    id 'org.jetbrains.kotlin.jvm'
    // Must be the same version as kotlin.jvm above, which the root project pins.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20'
}

version = compose_version
group = maven_group

repositories {
    maven {
        // androidx.collection / androidx.annotation, pulled in by the Compose runtime. Not on Maven
        // Central, and nothing else here should ever resolve from Google.
        name = "Google"
        url = "https://maven.google.com"
        content {
            includeGroupByRegex "androidx\\..*"
        }
    }
}

jarJar.enable()

configurations {
    // Same shape as the core project: everything in `libraries` is both a compile dependency, an api
    // dependency of the published artifact, and Jar-in-Jar'd into the mod jar below.
    libraries
    api.extendsFrom libraries
}

base {
    archivesName = "ldlib2-compose-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

kotlin {
    jvmToolchain(21)
}

sourceSets.main.kotlin { srcDir("src/main/java") }

// The core's access transformer, so both projects compile against the same Minecraft. Not shipped in
// this jar's mods.toml - at runtime the core applies it.
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

/**
 * Jar-in-Jar a library, pinning the embedded artifact to exactly {@code ver} while still advertising
 * {@code [ver,)} as the compatible range, so NeoForge can still dedupe against other mods shipping
 * the same library.
 *
 * <p>Declaring only the open range lets Gradle resolve it to whatever is newest in the repository at
 * build time, which is not what this was compiled against: for {@code runtime-desktop} that once
 * picked up a 5 KB alias stub with no classes in it at all.
 */
void embed(String group, String name, String ver) {
    dependencies.jarJar(group: group, name: name) {
        version {
            require "[${ver},)"
            prefer ver
        }
    }
}

dependencies {
    // compileOnly, not implementation: NeoGradle materialises its own patched Minecraft jar per
    // project, under <project>/.gradle/repositories. Putting it on this module's *runtime* classpath
    // as well as the core's lands both copies in the dev run, and FML aborts with "Found multiple
    // copies of net/minecraft/server/MinecraftServer.class". At runtime Minecraft always comes from
    // the core project (dev) or from the loader (production), so this module never needs its own.
    compileOnly "net.neoforged:neoforge:${neo_version}"
    // api, not implementation: half of what these composables take and return is LDLib2's own types
    // - UIElement, ModularUI, Stylesheet - so a consumer cannot call them without the core on its
    // compile classpath.
    api rootProject

    // Compose runtime - the recomposition engine only. `compose.ui` is deliberately absent: the
    // rendering side is LDLib2's own UIElement tree, reached through a custom Applier.
    libraries("org.jetbrains.compose.runtime:runtime-desktop:${compose_runtime_version}")
    // rememberSaveable and SaveableStateHolder. Same version line as the runtime, and its only other
    // dependencies are ones already embedded below.
    libraries("org.jetbrains.compose.runtime:runtime-saveable-desktop:${compose_runtime_version}")
    // The runtime's transitives, each of which needs its own jarJar entry. `annotation-internal` /
    // `collection-internal` are alias modules with no classes of their own, so only the artifacts
    // they redirect to are listed. Re-check with `gradlew :module.compose:dependencies
    // --configuration libraries` after a compose bump.
    embed('org.jetbrains.compose.runtime', 'runtime-desktop', compose_runtime_version)
    embed('org.jetbrains.compose.runtime', 'runtime-saveable-desktop', compose_runtime_version)
    embed('androidx.annotation', 'annotation-jvm', androidx_annotation_version)
    embed('androidx.collection', 'collection-jvm', androidx_collection_version)
    embed('org.jetbrains.kotlinx', 'atomicfu-jvm', atomicfu_version)
    embed('org.jetbrains.kotlinx', 'kotlinx-coroutines-core-jvm', kotlinx_coroutines_version)

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = false
    }
}

tasks.withType(ProcessResources).configureEach {
    // The LDLib2 version mods.toml asks for. ldlib2_min_version names the first *release* with the hooks
    // this module needs; until that release exists, the core in this checkout - which already has them -
    // is older than that, and asking for the release would stop every dev run from loading. Publishing
    // refuses a core older than ldlib2_min_version (below), so a published jar always asks for the release.
    def coreVersion = rootProject.version.toString()
    def requiredCore = compareVersions(coreVersion, ldlib2_min_version) < 0 ? coreVersion : ldlib2_min_version
    var replaceProperties = [
            "version"           : version,
            "loader_version"    : loader_version,
            "mod_license"       : mod_license,
            "mod_url"           : mod_url,
            "ldlib2_min_version": requiredCore,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Dev runs. This module joins the core project's runs rather than declaring its own - one client,
// both mods - but only when asked to, so the core's runs and its CI stay free of it:
//
//     gradlew runClient -Pcompose            (or compose=true in ~/.gradle/gradle.properties, for an
//                                             IDE whose generated run configurations should load it)
//
// Registered from here so that dropping this module from settings.gradle leaves the core untouched.
//
// Captured locals, not `project.…`: inside a run closure the delegate is the Run, and NeoGradle's
// Run has its own getProject() pointing at the project that declared the run - the root. Reading
// `project.sourceSets.main` in there silently re-adds the core source set instead of this one.
def composeSources = sourceSets.main
def composeLibraries = configurations.libraries

// NeoGradle gives every project it is applied to its own client/server/data/gameTestServer runs.
// An unqualified `gradlew runClient` runs the task in all projects that have it, so this module's
// copy - which nothing configures - would launch alongside the core's and fail the build even when
// the real run passed. The module joins the core's runs instead; its own are dead weight.
tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }
        .configureEach { enabled = false }

// The root's test orchestrators are plain tasks that happen to be named like runs. Asked for without a
// project path, Gradle looks for them here as well, and NeoGradle's `run<RunName>` task rule answers
// by inventing a run of type "parTest" / "mpTest" - which fails the whole build at configuration time.
// A task by the same name keeps the rule from being consulted.
['runParTest', 'runMpTest'].each { name -> tasks.register(name) { enabled = false } }

// A Gradle property, read through providers rather than hasProperty(): the latter also answers for
// extensions, and a compose-related plugin registering one called `compose` would switch this on.
def joinCoreRuns = providers.gradleProperty('compose').map { it != 'false' }.getOrElse(false)
if (joinCoreRuns) {
    rootProject.runs.configureEach {
        modSource composeSources
        dependencies {
            runtime composeLibraries
        }
    }
}

/** Numeric comparison of dotted versions; a missing component counts as 0. */
static int compareVersions(String a, String b) {
    def left = a.tokenize('.').collect { it.replaceAll('[^0-9].*', '') as int }
    def right = b.tokenize('.').collect { it.replaceAll('[^0-9].*', '') as int }
    for (int i = 0; i < Math.max(left.size(), right.size()); i++) {
        int diff = (i < left.size() ? left[i] : 0) <=> (i < right.size() ? right[i] : 0)
        if (diff != 0) return diff
    }
    return 0
}

// The published pom depends on the core at its current mod_version. Publishing while that is older
// than ldlib2_min_version would hand every consumer a core without the hooks this module calls, which
// compiles against nothing and crashes at runtime - so it is refused rather than released.
def coreVersion = rootProject.version.toString()
tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (compareVersions(coreVersion, ldlib2_min_version) < 0) {
            throw new GradleException("ldlib2-compose ${compose_version} needs LDLib2 ${ldlib2_min_version} or later, " +
                    "but this checkout's core is ${coreVersion}. Release the core first (or lower ldlib2_min_version " +
                    "if the hooks really are in an older release).")
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "https://maven.firstdark.dev/snapshots"
            credentials {
                username System.getenv("MAVEN_USER")
                password System.getenv("MAVEN_PASS")
            }
        }
    }
}

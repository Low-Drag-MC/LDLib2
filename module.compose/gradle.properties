# ldlib2-compose is versioned and released on its own, independently of LDLib2 itself:
# .github/workflows/compose-build-publish.yml publishes it, the core workflow never touches it.
compose_version=1.0.0
# The oldest LDLib2 this module runs on: the first release carrying the four hooks it needs
# (UIElement#reorderChildren / #getContentHost, ScrollerView#getContentHost, ModularUI#addFrameCallback).
# Written into neoforge.mods.toml, and publishing refuses to go ahead against an older core.
ldlib2_min_version=2.2.44

# Compose Multiplatform 1.8.x is the line built against Kotlin 2.1.x - 1.9+ wants Kotlin 2.2.
compose_runtime_version=1.8.2
# Transitives of the compose runtime, listed only because each needs its own jarJar entry to make it
# into the mod jar. See the note beside those entries in build.gradle.
androidx_annotation_version=1.9.1
androidx_collection_version=1.5.0
atomicfu_version=0.23.2
kotlinx_coroutines_version=1.8.0

# Released independently of LDLib2 by .github/workflows/compose-build-publish.yml.
compose_version=1.0.0
# Oldest LDLib2 with the hooks this module calls; goes into neoforge.mods.toml.
ldlib2_min_version=2.2.44

# 1.8.x is the Compose line built against Kotlin 2.1.x; 1.9+ needs Kotlin 2.2.
compose_runtime_version=1.8.2
# Compose runtime transitives, each Jar-in-Jar'd separately (see build.gradle).
androidx_annotation_version=1.9.1
androidx_collection_version=1.5.0
atomicfu_version=0.23.2
kotlinx_coroutines_version=1.8.0

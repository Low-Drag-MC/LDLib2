# Released independently of LDLib2 by .github/workflows/compose-build-publish.yml.
# <Minecraft line>.<release>: the first two parts name the Minecraft line the jar is built for
# (21.0 = 1.21.x, 26.1 = 26.1, 26.2 = 26.2), the last two count this module's releases on that line.
# A jar only runs on its own line, so each Minecraft version gets its own build.
compose_version=26.2.0.1
compose_archives_name=ldlib2-compose-26.2
# Oldest LDLib2 with the hooks this module calls; goes into neoforge.mods.toml.
ldlib2_min_version=26.2.2.45

# 1.8.x is the Compose line built against Kotlin 2.1.x; 1.9+ needs Kotlin 2.2. What counts is the
# kotlin-stdlib the core ships (kotlin_stdlib_version, 2.1.x), not the Kotlin this is compiled with.
compose_runtime_version=1.8.2
# Compose runtime transitives, each Jar-in-Jar'd separately (see build.gradle).
androidx_annotation_version=1.9.1
androidx_collection_version=1.5.0
atomicfu_version=0.23.2
kotlinx_coroutines_version=1.8.0
